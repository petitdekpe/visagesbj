knpu_oauth2_client:
    clients:
        # will create service: "knpu.oauth2.client.google"
        google:
            type: google
            client_id: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'
            redirect_route: admin_login_google_check
            redirect_params: {}
